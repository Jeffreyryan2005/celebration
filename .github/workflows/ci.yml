name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npx jest --passWithNoTests --maxWorkers=2

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AQ.mock_ci_key_placeholder' }}
